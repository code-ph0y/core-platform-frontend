services:
  frontend:
    image: node:20-alpine

    working_dir: /app

    ports:
      - "127.0.0.1:4200:4200"

    volumes:
      - ..:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    command:
      - sh
      - -c
      - >
        npm ci &&
        npx ng serve --host 0.0.0.0 --port 4200 --poll 1000 --proxy-config proxy.conf.json

    networks:
      - app-net

networks:
  app-net:
    external: true
    name: docker_app-net

